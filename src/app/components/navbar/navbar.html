<nav class="navbar">
    <div class="navbar-brand">
        <img src="logo-henker.png" alt="Consultorio Dra. Edith Henker" class="brand-logo">
    </div>
    <ul class="navbar-links">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a></li>
        <li><a routerLink="/nosotros" routerLinkActive="active">Sobre Nosotros</a></li>
        <li><a routerLink="/servicios" routerLinkActive="active">Servicios</a></li>
        <li><a routerLink="/citas" routerLinkActive="active">Agendar cita</a></li>
        @if (esAdmin()) {
            <li><a routerLink="/admin/servicios" routerLinkActive="active">Gestionar servicios</a></li>
            <li><a routerLink="/admin/pacientes" routerLinkActive="active">Pacientes</a></li>
        }
        @if (!logueado()) {
            <li><a routerLink="/login" routerLinkActive="active">Iniciar sesión</a></li>
            <li><a routerLink="/registro" routerLinkActive="active">Registrarse</a></li>
        } @else {
            <li><button class="btn-logout" (click)="cerrarSesion()">Cerrar sesión</button></li>
        }
    </ul>
</nav>
