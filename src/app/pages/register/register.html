<section class="register-container">
    <h2 class="text-center mb-4">Registro de paciente</h2>
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <div class="mb-3">
            <label for="name" class="form-label">Nombre completo</label>
            <input type="text" id="name" name="name" class="form-control" [(ngModel)]="user.name" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" id="email" name="email" class="form-control" [(ngModel)]="user.email" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" [(ngModel)]="user.password" required minlength="6">
        </div>

        <button type="submit" class="w-100" [disabled]="!registerForm.valid">Registrarme</button>
    </form>

    @if (mensaje) {
        <p class="mensaje">{{ mensaje }}</p>
    }
</section>
