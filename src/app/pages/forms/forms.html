<section class="login-container">
    <h2 class="text-center mb-4">Iniciar sesión</h2>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" id="email" name="email" class="form-control" [(ngModel)]="credentials.email" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" [(ngModel)]="credentials.password" required>
        </div>

        <button type="submit" class="w-100" [disabled]="!loginForm.valid">Ingresar</button>
    </form>
</section>
