
<div class="contenedor">
  <h1>Administración de Servicios</h1>

  <!-- Formulario para crear un nuevo servicio -->
  <form class="formulario" (ngSubmit)="crearServicio()">
    <input
      type="text"
      placeholder="Nombre del servicio"
      [(ngModel)]="nuevoServicio.name"
      name="name"
      required
    />
    <input
      type="text"
      placeholder="Descripción"
      [(ngModel)]="nuevoServicio.description"
      name="description"
      required
    />
    <input
      type="text"
      placeholder="Categoría"
      [(ngModel)]="nuevoServicio.category"
      name="category"
      required
    />
    <input
      type="number"
      placeholder="Precio"
      [(ngModel)]="nuevoServicio.price"
      name="price"
      required
    />
    <button type="submit">Agregar</button>
  </form>

  @if (cargando()) {
    <p class="cargando">Cargando servicios...</p>
  }

  <div class="lista">
    @for (servicio of servicios(); track servicio._id) {
      <div class="tarjeta">
        <div class="cuerpo">
          <strong class="nombre">{{ servicio.name }}</strong>
          @if (servicio.category) {
            <span class="categoria">{{ servicio.category }}</span>
          }
          <p class="descripcion">{{ servicio.description }}</p>
          <span class="precio">${{ servicio.price }}</span>
        </div>
        <button class="btn-eliminar" (click)="eliminarServicio(servicio._id!)">
          Eliminar
        </button>
      </div>
    } @empty {
      <p>No hay servicios registrados.</p>
    }
  </div>
</div>
